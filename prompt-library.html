/*

<script>
  const API_URL = 'https://rtmcreator.com/bots/prompt-bot/api.php';
  let allPrompts = [];
  let currentPage = 1;
  let activeFilter = 'all';
  let searchTerm = '';

  const catIcons = {
    'AI Art': '🎨',
    'ChatGPT Prompt': '🤖',
    'Photo Editing': '📷',
    'Gaming Banner': '🎮',
    'Thumbnail': '📺',
    'Content Writing': '✍️',
    'Marketing': '📣'
  };

  function esc(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escJs(str) {
    if (!str) return '';
    return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
  }

  async function fetchPrompts(page = 1) {
    const spinner = document.getElementById('pl-spinner');
    const loadMore = document.getElementById('pl-load-more');
    spinner.style.display = 'block';
    if (page === 1) document.getElementById('pl-grid').innerHTML = '';

    try {
      const resp = await fetch(`${API_URL}?page=${page}`);
      const data = await resp.json();
      
      if (data.success) {
        if (page === 1) allPrompts = data.prompts;
        else allPrompts = [...allPrompts, ...data.prompts];

        renderGrid();
        loadMore.style.display = (data.prompts.length === 12) ? 'inline-block' : 'none';
      }
    } catch (err) {
      console.error('Fetch error:', err);
    } finally {
      spinner.style.display = 'none';
    }
  }

  function renderGrid() {
    const favs = JSON.parse(localStorage.getItem('pl_favs') || '[]');
    const filtered = allPrompts.filter(p => {
      const matchCat = activeFilter === 'all' ? true : (activeFilter === 'favs' ? favs.includes(p.id.toString()) : p.category === activeFilter);
      const term = searchTerm.toLowerCase();
      return matchCat && (!term || (p.prompt || '').toLowerCase().includes(term) || (p.category || '').toLowerCase().includes(term));
    });

    const grid = document.getElementById('pl-grid');
    grid.innerHTML = '';
    document.getElementById('pl-empty').style.display = filtered.length === 0 ? 'block' : 'none';

    filtered.forEach((p, idx) => {
      const card = createCard(p);
      card.style.animation = `plEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards ${idx * 0.05}s`;
      card.style.opacity = '0';
      grid.appendChild(card);
    });
  }

  function isFav(id) {
    const favs = JSON.parse(localStorage.getItem('pl_favs') || '[]');
    return favs.includes(id.toString());
  }

  function toggleFav(e, id) {
    e.stopPropagation();
    let favs = JSON.parse(localStorage.getItem('pl_favs') || '[]');
    const idStr = id.toString();
    if (favs.includes(idStr)) {
      favs = favs.filter(f => f !== idStr);
    } else {
      favs.push(idStr);
    }
    localStorage.setItem('pl_favs', JSON.stringify(favs));
    renderGrid();
    
    // If modal is open, update its heart too
    const modalHeart = document.getElementById('pl-modal-fav-btn');
    if (modalHeart) {
      const active = favs.includes(idStr);
      modalHeart.classList.toggle('active', active);
      modalHeart.innerHTML = active ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
    }
  }

  function createCard(p) {
    const card = document.createElement('div');
    card.className = 'pl-card';
    const icon = catIcons[p.category] || '📁';
    const thumb = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : '';
    const activeFav = isFav(p.id);
    
    card.innerHTML = `
      <div class="pl-card-img-wrap">
        ${thumb ? `<img class="pl-card-img" src="${thumb}" alt="Preview" loading="lazy">` : 
        `<div style="height:100%; display:flex; align-items:center; justify-content:center; font-size:4.5rem; opacity:0.3;">${icon}</div>`}
      </div>
      <div class="pl-card-body">
        <span class="pl-cat-badge">${icon} ${p.category}</span>
        <h3 class="pl-card-title">${esc(p.text_output || p.category + ' Prompt')}</h3>
        <p class="pl-card-preview">${esc(p.prompt)}</p>
        <div class="pl-card-footer" style="justify-content: flex-end;">
          <div class="pl-btn-group">
            <button class="pl-fav-btn ${activeFav ? 'active' : ''}" onclick="toggleFav(event, \`${p.id}\`)" title="Save Prompt">
              <i class="${activeFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
            </button>
            <button class="pl-share-btn" onclick="plShare(event, \`${escJs(p.prompt.substring(0, 100))}\`, \`${p.id}\`)" title="Share Prompt">
              <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button class="pl-copy-btn" onclick="plCopy(event, this, \`${escJs(p.prompt)}\`)">📋 Copy</button>
          </div>
        </div>
      </div>
    `;
    card.addEventListener('click', (e) => { if (!e.target.closest('button')) openModal(p); });
    return card;
  }

  function openModal(p) {
    const overlay = document.getElementById('pl-modal-overlay');
    const imgsEl = document.getElementById('pl-modal-imgs');
    const icon = catIcons[p.category] || '📁';
    const imgs = p.image_urls || [];
    const activeFav = isFav(p.id);

    if (p.video_url) {
      imgsEl.innerHTML = `
        <div class="pl-video-container">
          <video class="pl-video" controls poster="${imgs[0] || ''}">
            <source src="${p.video_url}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      `;
    } else {
      imgsEl.innerHTML = imgs.map(src => `<div style="text-align:center;"><img src="${src}" style="width:100%; max-width:600px; border-radius:24px; border:1px solid var(--pl-border); box-shadow: 0 10px 30px rgba(0,0,0,0.3);"></div>`).join('');
    }
    
    document.getElementById('pl-modal-badges').innerHTML = `<span class="pl-cat-badge">${icon} ${esc(p.category)}</span>`;
    document.getElementById('pl-modal-title').textContent = p.text_output || `${p.category} Prompt`;
    document.getElementById('pl-modal-prompt').textContent = p.prompt;
    
    const copyBtn = document.getElementById('pl-modal-copy-btn');
    copyBtn.onclick = (e) => plCopy(e, copyBtn, p.prompt, '📋 Copy Full Prompt');

    const shareBtn = document.getElementById('pl-modal-share-btn');
    shareBtn.onclick = (e) => plShare(e, p.prompt.substring(0, 100), p.id);
    
    const favBtn = document.getElementById('pl-modal-fav-btn');
    favBtn.onclick = (e) => toggleFav(e, p.id);
    favBtn.classList.toggle('active', activeFav);
    favBtn.innerHTML = activeFav ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
    
    document.getElementById('pl-modal-meta').innerHTML = `
      <div style="display:flex; align-items:center; gap:8px;">🆔 ID: <strong style="color:#fff;">#${p.id}</strong></div>
      <div style="display:flex; align-items:center; gap:8px;">👤 Creator: <strong style="color:#fff;">${esc(p.username || 'Anonymous')}</strong></div>
      <div style="display:flex; align-items:center; gap:8px;">📅 ${new Date(p.created_at).toLocaleDateString()}</div>
    `;

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function plCopy(e, btn, text, originalText = '📋 Copy') {
    e.stopPropagation();
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✅ Copied!';
      btn.style.background = '#10b981';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = '';
      }, 2000);
    });
  }

  function plShare(e, text, id) {
    e.stopPropagation();
    const shareData = {
      title: 'Awesome Prompt',
      text: text,
      url: window.location.href + '?id=' + id
    };
    if (navigator.share) {
      navigator.share(shareData);
    } else {
      navigator.clipboard.writeText(shareData.url);
      alert('Link copied to clipboard!');
    }
  }

  document.getElementById('pl-modal-close').addEventListener('click', () => {
    document.getElementById('pl-modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  });

  document.getElementById('pl-modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('pl-modal-overlay')) {
      document.getElementById('pl-modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  document.getElementById('pl-search').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderGrid();
  });

  document.querySelectorAll('.pl-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pl-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.cat;
      renderGrid();
    });
  });

  document.getElementById('pl-load-more').addEventListener('click', () => {
    currentPage++;
    fetchPrompts(currentPage);
  });

  // Initial Fetch
  fetchPrompts();
</script>

<style>
@keyframes plEntrance {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>
