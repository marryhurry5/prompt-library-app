plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.rtmcreator.aiprompthub"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.rtmcreator.aiprompthub"
        minSdk = 21
        targetSdk = 36
        versionCode = 7
        versionName = "1.0.4"
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias'] ?: 'upload'
            keyPassword = keystoreProperties['keyPassword'] ?: 'promptbot123'
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : file('upload-keystore.jks')
            storePassword = keystoreProperties['storePassword'] ?: 'promptbot123'
        }
    }

    buildTypes {
        release {
            def releaseKeyStore = signingConfigs.release.storeFile ? file(signingConfigs.release.storeFile) : file('upload-keystore.jks')
            if (releaseKeyStore.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
