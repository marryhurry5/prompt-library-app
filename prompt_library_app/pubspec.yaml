name: prompt_library_app
description: "A modern, clean, and premium AI Prompt Library mobile application connected to PHP/MySQL backend."
publish_to: "none"
version: 1.0.3+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  google_mobile_ads: ^5.0.0
  url_launcher: ^6.2.4
  cached_network_image: ^3.3.1
  flutter_spinkit: 5.2.0
  google_fonts: ^6.1.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.2.2
  share_plus: ^10.0.0
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
